﻿
<title>B2 MSNR</title>
<meta name="description" content="تعلم استراتيجية MSNR للدعم والمقاومة بطريقة مبسطة ومنهجية من خلال دورة MSNR المتخصصة.">
<meta name="keywords" content="MSNR, Support and Resistance, الدعم والمقاومة, استراتيجية MSNR, دورة MSNR, Forex MSNR">
<meta property="og:title" content="B2 — دورة MSNR">
<meta property="og:description" content="تعلم استراتيجية MSNR للدعم والمقاومة بطريقة منهجية ومنظمة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #ffffff;
  --surf:      #f5f5f5;
  --surf2:     #eeeeee;
  --border:    #e0e0e0;
  --border2:   #cccccc;
  --red:       #e60000;
  --red-hi:    #cc0000;
  --gold:      #e60000;
  --text:      #111111;
  --muted:     #555555;
  --dim:       #999999;
  --ff-disp:   'Cairo', sans-serif;
  --ff-en:     'Inter', 'Segoe UI', sans-serif;
  --ff-label:  'Inter', 'Segoe UI', sans-serif;
  --ff-ar:     'Cairo', sans-serif;
  --ff-body:   'Inter', 'Cairo', sans-serif;
}

html { scroll-behavior: smooth; font-size: 16px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ff-body);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
[data-lang="ar"] body, body[data-lang="ar"] {
  font-family: 'Cairo', sans-serif;
  line-height: 1.85;
}
[data-lang="en"] body, body[data-lang="en"] {
  font-family: 'Inter', sans-serif;
  line-height: 1.7;
}
/* Arabic headings need more breathing room */
[data-lang="ar"] h1,[data-lang="ar"] h2,[data-lang="ar"] h3 {
  font-family: 'Cairo', sans-serif;
  line-height: 1.3;
}
[data-lang="en"] h1,[data-lang="en"] h2,[data-lang="en"] h3 {
  font-family: 'Inter', sans-serif;
  line-height: 1.1;
}

[lang="ar"] body, body[data-lang="ar"] { direction: rtl; }
[lang="en"] body, body[data-lang="en"] { direction: ltr; }

/* ─── Typography ─────────────────────────────────────────── */
.display {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.1;
  text-wrap: balance;
}
[data-lang="ar"] .display {
  font-family: 'Cairo', sans-serif;
  letter-spacing: 0;
  line-height: 1.3;
  font-weight: 800;
}

.label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--red);
  font-family: 'Inter', sans-serif;
}
[data-lang="ar"] .label {
  font-family: 'Cairo', sans-serif;
  letter-spacing: 0.05em;
  font-size: 0.75rem;
}

/* ─── Layout ─────────────────────────────────────────────── */
.container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }
section { padding: 96px 0; }
.section-head { margin-bottom: 56px; }
.section-head .label { margin-bottom: 14px; }

/* ─── Header ─────────────────────────────────────────────── */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  border-bottom: 1px solid transparent;
  transition: background 0.3s, border-color 0.3s;
}
#header.scrolled {
  background: rgba(255,255,255,0.96);
  border-color: var(--border);
  backdrop-filter: blur(14px);
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 64px; gap: 24px;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--text); flex-shrink: 0;
}
.logo-mark svg { display: block; }
.logo-text {
  font-family: var(--ff-label);
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: 0.14em;
  color: var(--text);
  text-transform: uppercase;
}
nav { display: flex; align-items: center; gap: 2px; }
nav a {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  text-decoration: none;
  padding: 6px 14px;
  transition: color 0.2s;
  font-family: var(--ff-label);
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
[data-lang="ar"] nav a { font-family: var(--ff-ar); letter-spacing: 0.05em; }
nav a:hover { color: var(--text); }
.header-actions { display: flex; align-items: center; gap: 12px; }
.lang-toggle {
  background: none; border: 1px solid var(--border2);
  color: var(--muted); font-size: 0.72rem;
  font-family: var(--ff-en); font-weight: 600;
  letter-spacing: 0.1em; padding: 5px 10px;
  cursor: pointer; transition: all 0.2s;
}
.lang-toggle:hover { border-color: var(--dim); color: var(--text); }
.btn-header {
  background: var(--red); color: #fff;
  border: none; padding: 9px 20px;
  font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.14em; cursor: pointer; text-transform: uppercase;
  font-family: var(--ff-label); transition: background 0.2s;
  text-decoration: none; display: inline-block;
}
[data-lang="ar"] .btn-header { font-family: var(--ff-ar); }
.btn-header:hover { background: var(--red-hi); }
.hamburger {
  display: none; flex-direction: column; gap: 4px;
  background: none; border: none; cursor: pointer; padding: 4px;
}
.hamburger span {
  display: block; width: 22px; height: 1.5px;
  background: var(--text); transition: all 0.3s;
}
.mobile-nav {
  display: none; position: fixed; top: 64px; left: 0; right: 0; bottom: 0;
  background: var(--bg); z-index: 99; padding: 32px 24px;
  flex-direction: column; gap: 4px; border-top: 1px solid var(--border);
}
.mobile-nav.open { display: flex; }
.mobile-nav a {
  color: var(--text); text-decoration: none;
  font-size: 1.1rem; font-weight: 500;
  padding: 14px 0; border-bottom: 1px solid var(--border);
  font-family: var(--ff-body);
}

/* ─── Buttons ─────────────────────────────────────────────── */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 16px 28px; font-size: 1.05rem;
  font-weight: 700; letter-spacing: 0;
  cursor: pointer; transition: all 0.2s; text-decoration: none;
  font-family: 'Cairo', sans-serif; border: none;
  width: 100%; border-radius: 0; line-height: 1.4;
}
[data-lang="en"] .btn { font-family: 'Inter', sans-serif; font-size: 0.9rem; letter-spacing: 0.05em; line-height: 1.2; }
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-hi); }
.btn-ghost {
  background: #000; color: #fff; border: none;
}
.btn-ghost:hover { background: #222; }

/* ─── HERO ────────────────────────────────────────────────── */
#hero {
  min-height: 100vh; display: flex; align-items: flex-start;
  padding: 80px 0 60px; position: relative; overflow: hidden;
  background: #fff;
}
.hero-grid {
  display: flex; flex-direction: column;
  align-items: center; text-align: center; width: 100%;
  gap: 0;
}
[data-lang="ar"] .hero-grid { direction: rtl; }
.hero-content { position: relative; z-index: 2; width: 100%; }
.hero-content .label { margin-bottom: 16px; display: none; }
.hero-h1 {
  font-size: clamp(2.2rem, 7.5vw, 5.5rem);
  line-height: 1.28;
  margin-bottom: 20px;
  font-family: 'Cairo', sans-serif;
  font-weight: 800;
  letter-spacing: 0;
}
[data-lang="en"] .hero-h1 {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.hero-h1 .line-1 {
  color: var(--text);
  font-weight: 800;
  font-style: normal;
  display: block;
  font-size: 0.58em;
  line-height: 1.4;
}
[data-lang="en"] .hero-h1 .line-1 { font-weight: 900; font-size: 0.52em; line-height: 1.2; }
.hero-h1 .line-1 .snr-red { color: var(--red); }
.hero-h1 .line-2 {
  color: var(--text);
  font-weight: 800;
  font-style: normal;
  display: block;
  line-height: 1.2;
}
[data-lang="en"] .hero-h1 .line-2 { font-weight: 900; line-height: 1.0; }
.hero-h1 .line-3 {
  color: var(--text);
  font-weight: 700;
  font-style: normal;
  font-size: 0.68em;
  display: block;
  line-height: 1.35;
}
[data-lang="en"] .hero-h1 .line-3 { font-weight: 800; font-size: 0.6em; line-height: 1.15; }
.hero-h1 .accent { color: var(--text); font-style: normal; }
.hero-h1 .dim-line { color: var(--muted); font-weight: 700; font-size: 0.6em; }
.hero-sub {
  font-size: 1.05rem; color: var(--muted);
  max-width: 540px; margin: 0 auto 36px; line-height: 1.85;
  font-family: 'Cairo', sans-serif; font-weight: 400;
}
[data-lang="en"] .hero-sub {
  font-family: 'Inter', sans-serif; font-size: 1rem; line-height: 1.7;
}
.hero-ctas {
  display: flex; gap: 0; flex-wrap: wrap;
  margin-bottom: 32px; flex-direction: column; align-items: center;
  width: 100%; max-width: 380px; margin-left: auto; margin-right: auto;
}
.hero-price {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 0; border-top: 1px solid var(--border);
}
.hero-price-label { font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); font-family: var(--ff-label); }
[data-lang="ar"] .hero-price-label { font-family: var(--ff-ar); letter-spacing: 0.08em; }
.hero-price-value {
  font-family: var(--ff-label); font-size: 1.9rem;
  font-weight: 700; color: var(--gold); letter-spacing: 0.04em;
}

/* ─── Stamp widget (Wayfare-style) ───────────────────────── */
.hero-stamp {
  position: absolute; top: 20px; right: 20px;
  border: 2px solid var(--red); padding: 16px 22px;
  text-align: center; background: rgba(12,9,8,0.7);
  backdrop-filter: blur(6px);
}
[data-lang="ar"] .hero-stamp { right: auto; left: 20px; }
.hero-stamp::before {
  content: ''; position: absolute; inset: 4px;
  border: 1px solid rgba(224,80,56,0.4); pointer-events: none;
}
.stamp-eyebrow {
  font-family: var(--ff-label); font-size: 0.55rem;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
.stamp-main {
  font-family: var(--ff-label); font-size: 2rem;
  font-weight: 700; color: var(--red);
  letter-spacing: 0.1em; line-height: 1;
}
.stamp-course {
  font-family: var(--ff-label); font-size: 0.55rem;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold); margin-top: 4px;
}
.stamp-divider {
  width: 32px; height: 1px; background: var(--border2);
  margin: 10px auto;
}
.stamp-meta {
  font-family: var(--ff-label); font-size: 0.6rem;
  letter-spacing: 0.16em; color: var(--muted);
  text-transform: uppercase;
}
.hero-chart {
  position: relative; width: 100%; max-width: 560px;
  margin: 0 auto; margin-top: 24px;
  border: 1.5px solid #ccc;
  border-radius: 4px; overflow: hidden;
  background: #fff;
}
#heroChartImg {
  width: 100%; height: auto;
  display: block;
}
.hero-chart-label {
  position: absolute; bottom: 12px; right: 12px;
  font-family: var(--ff-en); font-size: 0.65rem;
  letter-spacing: 0.12em; color: var(--dim);
  text-transform: uppercase;
}
[data-lang="ar"] .hero-chart-label { right: auto; left: 12px; }

/* hero bg lines */
.hero-bg {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
}
.hero-bg-line {
  position: absolute; background: var(--border);
  opacity: 0.4;
}

/* ─── ABOUT ───────────────────────────────────────────────── */
#about { border-top: 1px solid var(--border); }
.about-grid {
  display: block;
  max-width: 740px;
}
.about-photo {
  aspect-ratio: 3/4; background: var(--surf);
  border: 1px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  color: var(--dim); font-size: 0.75rem;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.about-photo svg { opacity: 0.3; }
.about-content {}
.about-h2 {
  font-size: clamp(1.8rem, 3vw, 2.6rem);
  margin-bottom: 24px;
}
.about-content p {
  color: var(--muted); font-size: 0.95rem;
  line-height: 1.75; margin-bottom: 16px;
}
.about-tags {
  display: flex; flex-direction: column; gap: 0;
  margin-top: 36px; border: 1px solid var(--border);
}
.about-tag {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  font-size: 0.82rem; color: var(--muted);
  display: flex; align-items: center; gap: 12px;
}
.about-tag:last-child { border-bottom: none; }
.about-tag::before {
  content: ''; display: block;
  width: 6px; height: 6px; background: var(--red); flex-shrink: 0;
}

/* ─── PROBLEM ─────────────────────────────────────────────── */
#problem { background: var(--surf); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.problem-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 64px; align-items: start;
}
.problem-h2 {
  font-size: clamp(2rem, 3.5vw, 3rem);
  margin-bottom: 20px; line-height: 1.1;
}
.problem-intro { color: var(--muted); font-size: 0.95rem; line-height: 1.75; }
.problem-list {
  display: flex; flex-direction: column; gap: 0; margin-top: 8px;
}
.problem-item {
  padding: 18px 0; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 14px;
  font-size: 0.88rem; color: var(--muted);
}
.problem-item:first-child { border-top: 1px solid var(--border); }
.problem-x {
  font-family: var(--ff-en); color: var(--red);
  font-size: 0.8rem; font-weight: 700;
  flex-shrink: 0; margin-top: 1px;
}
.problem-cta-wrap { margin-top: 36px; }

/* ─── MSNR EXPLANATION ─────────────────────────────────────── */
#snr { border-bottom: 1px solid var(--border); }
.snr-h2 { font-size: clamp(2rem, 3.5vw, 3rem); margin-bottom: 10px; }
.snr-def { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-family: var(--ff-en); margin-bottom: 48px; }
[data-lang="ar"] .snr-def { font-family: var(--ff-ar); }
.snr-cards {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; margin-bottom: 56px; background: var(--border);
}
.snr-card {
  background: var(--surf); padding: 36px 32px;
}
.snr-card-label {
  font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--red); margin-bottom: 10px; font-family: var(--ff-en); font-weight: 600;
}
[data-lang="ar"] .snr-card-label { font-family: var(--ff-ar); }
.snr-card-title {
  font-size: 1.6rem; font-weight: 700;
  margin-bottom: 14px; font-family: var(--ff-en);
}
[data-lang="ar"] .snr-card-title { font-family: var(--ff-ar); }
.snr-card p { font-size: 0.9rem; color: var(--muted); line-height: 1.7; }

.snr-visual { margin-bottom: 56px; }


.snr-beyond-title {
  font-size: 1.2rem; font-weight: 600;
  margin-bottom: 24px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.snr-beyond-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--border);
}
.snr-beyond-item {
  background: var(--bg); padding: 24px 20px;
  font-size: 0.85rem; color: var(--muted);
  display: flex; gap: 12px; align-items: flex-start;
}
.snr-beyond-item::before {
  content: ''; display: block;
  width: 4px; height: 4px; background: var(--red);
  flex-shrink: 0; margin-top: 7px;
}

/* ─── METHODOLOGY STEPS ───────────────────────────────────── */
#methodology { background: var(--surf); border-bottom: 1px solid var(--border); }
.meth-h2 { font-size: clamp(1.8rem, 3vw, 2.6rem); margin-bottom: 48px; }
.meth-steps { display: flex; flex-direction: column; gap: 0; }
.meth-step {
  display: grid; grid-template-columns: 48px 1fr;
  gap: 24px; padding: 28px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.meth-step:first-child { border-top: 1px solid var(--border); }
.meth-step-num {
  font-family: var(--ff-en); font-size: 0.75rem;
  font-weight: 700; color: var(--red);
  letter-spacing: 0.06em; padding-top: 3px;
}
.meth-step-content {}
.meth-step-title {
  font-size: 1rem; font-weight: 600;
  margin-bottom: 0; transition: color 0.2s;
  display: flex; align-items: center; justify-content: space-between;
}
.meth-step-title .toggle-icon {
  font-family: var(--ff-en); font-size: 1rem;
  color: var(--dim); transition: transform 0.3s; font-weight: 300;
}
.meth-step.active .toggle-icon { transform: rotate(45deg); color: var(--red); }
.meth-step-desc {
  font-size: 0.88rem; color: var(--muted);
  line-height: 1.7; max-height: 0; overflow: hidden;
  transition: max-height 0.4s ease, padding-top 0.3s;
}
.meth-step.active .meth-step-desc { max-height: 120px; padding-top: 12px; }
.meth-step:hover .meth-step-title { color: var(--red); }

/* ─── APPROACH ────────────────────────────────────────────── */
#approach { border-bottom: 1px solid var(--border); }
.approach-h2 { font-size: clamp(1.8rem, 3vw, 2.6rem); margin-bottom: 48px; }
.approach-vs {
  display: grid; grid-template-columns: 1fr auto 1fr;
  gap: 0; margin-bottom: 48px; background: var(--border); gap: 1px;
}
.approach-col { background: var(--surf); padding: 32px; }
.approach-col-left { opacity: 0.6; }
.approach-col-title {
  font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
  font-family: var(--ff-en); font-weight: 600; margin-bottom: 20px;
  padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
[data-lang="ar"] .approach-col-title { font-family: var(--ff-ar); }
.approach-col-left .approach-col-title { color: var(--dim); }
.approach-col-right .approach-col-title { color: var(--red); }
.approach-items { display: flex; flex-direction: column; gap: 10px; }
.approach-item {
  font-size: 0.85rem; color: var(--muted);
  display: flex; align-items: center; gap: 10px;
}
.approach-col-left .approach-item::before {
  content: '—'; color: var(--dim); font-size: 0.75rem; flex-shrink: 0;
}
.approach-col-right .approach-item::before {
  content: '✓'; color: var(--red); font-size: 0.75rem; flex-shrink: 0;
}
.approach-col-right .approach-item { color: var(--text); }
.vs-divider {
  background: var(--surf2); display: flex; align-items: center; justify-content: center;
  padding: 0 16px; font-family: var(--ff-en); font-size: 0.7rem;
  color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase;
  writing-mode: vertical-rl;
}
.approach-quote {
  padding: 32px; border: 1px solid var(--border2);
  border-left: 3px solid var(--red); margin-bottom: 16px;
}
[data-lang="ar"] .approach-quote { border-left: none; border-right: 3px solid var(--red); }
.approach-quote p {
  font-size: 1.05rem; color: var(--text); line-height: 1.6; font-style: italic;
}
.approach-note { font-size: 0.75rem; color: var(--dim); }

/* ─── COURSE ──────────────────────────────────────────────── */
#course { background: var(--surf); border-bottom: 1px solid var(--border); }
.course-header {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 48px; margin-bottom: 56px; align-items: end;
}
.course-h2 { font-size: clamp(1.8rem, 3vw, 2.6rem); margin-bottom: 16px; }
.course-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.75; }
.course-spec {
  display: flex; flex-direction: column; gap: 12px;
  border: 1px solid var(--border); padding: 28px;
}
.course-spec-item {
  display: flex; justify-content: space-between;
  align-items: center; font-size: 0.82rem;
  padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.course-spec-item:last-child { border-bottom: none; padding-bottom: 0; }
.course-spec-key { color: var(--dim); }
.course-spec-val { color: var(--text); font-weight: 500; }
.phases { display: flex; flex-direction: column; gap: 0; }
.phase {
  border: 1px solid var(--border); border-top: none;
  overflow: hidden;
}
.phase:first-child { border-top: 1px solid var(--border); }
.phase-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; cursor: pointer;
  transition: background 0.2s;
}
.phase-header:hover { background: var(--surf2); }
.phase-header-left { display: flex; align-items: center; gap: 16px; }
.phase-num { font-family: var(--ff-en); font-size: 0.68rem; color: var(--red); letter-spacing: 0.1em; font-weight: 700; }
.phase-title { font-size: 0.95rem; font-weight: 600; }
.phase-icon { color: var(--dim); font-size: 1rem; transition: transform 0.3s; }
.phase.open .phase-icon { transform: rotate(90deg); }
.phase-body {
  max-height: 0; overflow: hidden; transition: max-height 0.4s ease;
  background: var(--bg);
}
.phase.open .phase-body { max-height: 300px; }
.phase-items { padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 8px; }
.phase-item {
  font-size: 0.85rem; color: var(--muted);
  padding: 8px 0; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.phase-item:last-child { border-bottom: none; }
.phase-item::before { content: ''; display: block; width: 4px; height: 4px; background: var(--red); flex-shrink: 0; }

/* ─── PRICING + WHO ───────────────────────────────────────── */
#pricing { border-bottom: 1px solid var(--border); }
.pricing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
.price-box {
  border: 1px solid var(--border2); padding: 48px;
  display: flex; flex-direction: column; gap: 24px;
  background: var(--surf);
}
.price-label-sm { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); font-family: var(--ff-en); font-weight: 600; }
[data-lang="ar"] .price-label-sm { font-family: var(--ff-ar); }
.price-main { font-size: 4rem; font-family: var(--ff-label); font-weight: 700; line-height: 1; color: var(--gold); letter-spacing: 0.04em; }
.price-sub-text { font-size: 0.85rem; color: var(--muted); }
.price-btn { align-self: flex-start; }
.who-box { padding-top: 8px; }
.who-h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 24px; }
.who-yes { display: flex; flex-direction: column; gap: 0; margin-bottom: 28px; }
.who-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 0; border-bottom: 1px solid var(--border);
  font-size: 0.85rem; color: var(--text);
}
.who-item:first-child { border-top: 1px solid var(--border); }
.who-check { color: var(--red); font-family: var(--ff-en); font-size: 0.8rem; flex-shrink: 0; margin-top: 1px; }
.who-no {
  font-size: 0.82rem; color: var(--dim);
  padding: 16px 20px; border: 1px solid var(--border);
  line-height: 1.6;
}

/* ─── TESTIMONIALS ───────────────────────────────────────── */
#testimonials {
  background: var(--bg);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 96px 0;
}
#testimonials .container {
  direction: ltr; /* fix RTL interference */
  display: flex; flex-direction: column;
  align-items: center; text-align: center;
}
#testimonials .label { color: var(--red); margin-bottom: 12px; }
.test-h2 {
  font-size: clamp(1.8rem, 3vw, 2.6rem);
  margin-bottom: 48px; color: var(--text);
  text-align: center; width: 100%;
}
[data-lang="ar"] .test-h2 { font-family: 'Cairo', sans-serif; }

/* ── carousel stage (LTR coordinate frame, cards use px offsets) */
.cc-stage {
  position: relative;
  width: 540px; max-width: 100%;
  height: 280px;
  margin: 0 auto;
}

/* cards — positioned from center of stage */
.cc-card {
  position: absolute;
  top: 50%; left: 50%;
  width: 192px; height: 128px;
  margin-top: -64px; margin-left: -96px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  padding: 14px; cursor: pointer;
  display: flex; flex-direction: column; gap: 6px;
  transition: transform 0.65s cubic-bezier(0.22,1,0.36,1),
              opacity   0.65s cubic-bezier(0.22,1,0.36,1),
              box-shadow 0.3s;
  will-change: transform, opacity;
  text-align: start;
  direction: ltr;
}
[data-lang="ar"] .cc-card { direction: rtl; text-align: start; }
.cc-card.is-active {
  border-color: var(--border2);
  box-shadow: 0 8px 40px -8px rgba(0,0,0,0.15);
}
.cc-card-tag {
  display: inline-block;
  padding: 2px 8px; border-radius: 999px;
  background: var(--surf2);
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--red); font-family: 'Inter', sans-serif;
  align-self: flex-start;
}
.cc-card-body { display: flex; flex-direction: column; gap: 4px; }
.cc-card-title {
  font-size: 0.82rem; font-weight: 700; line-height: 1.3;
  color: var(--text); font-family: 'Cairo', sans-serif;
}
.cc-card.is-active .cc-card-title { font-size: 0.9rem; }
.cc-card-desc {
  font-size: 0.67rem; line-height: 1.5; color: var(--dim);
  overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  font-family: 'Cairo', sans-serif;
}
.cc-card.is-active .cc-card-desc { color: var(--muted); }

/* ghost counter behind cards */
.cc-counter {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 0;
}
.cc-counter-num {
  font-size: 3.5rem; font-weight: 800; line-height: 1;
  color: rgba(0,0,0,0.04); font-family: 'Inter', sans-serif;
}
.cc-counter-of {
  font-size: 0.7rem; margin-top: 4px;
  color: var(--dim); font-family: 'Inter', sans-serif;
}

/* controls */
.cc-controls {
  display: flex; align-items: center; gap: 16px;
  margin-top: 28px; justify-content: center;
}
.cc-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--border2); background: var(--bg);
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
}
.cc-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
.cc-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cc-dots { display: flex; align-items: center; gap: 6px; }
.cc-dot {
  height: 6px; border-radius: 999px; width: 6px;
  background: var(--border2); border: none; padding: 0; cursor: pointer;
  transition: width 0.3s, background 0.3s;
}
.cc-dot.is-active { width: 24px; background: var(--red); }

/* ─── FORM ────────────────────────────────────────────────── *//* ─── FORM ────────────────────────────────────────────────── */
#register { border-bottom: 1px solid var(--border); }
.form-layout { display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px; align-items: start; }
.form-intro-h2 { font-size: clamp(1.8rem, 3vw, 2.6rem); margin-bottom: 20px; }
.form-intro-p { font-size: 0.9rem; color: var(--muted); line-height: 1.75; }
.form-intro-price {
  margin-top: 36px; padding: 24px; border: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
}
.form-price-val { font-family: var(--ff-en); font-size: 2.2rem; font-weight: 700; }
.form-price-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
form { display: flex; flex-direction: column; gap: 20px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--dim); font-family: var(--ff-en); font-weight: 600;
}
[data-lang="ar"] .field label { font-family: var(--ff-ar); letter-spacing: 0; }
.field input, .field textarea, .field select {
  background: var(--surf); border: 1px solid var(--border);
  color: var(--text); padding: 12px 14px;
  font-size: 0.88rem; font-family: var(--ff-body);
  transition: border-color 0.2s; outline: none; width: 100%;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--dim); }
.field input.error, .field textarea.error, .field select.error { border-color: var(--red); }
.field textarea { min-height: 100px; resize: vertical; }
.field select { cursor: pointer; appearance: none; }
.field-error { font-size: 0.72rem; color: var(--red); }
.form-submit-btn {
  background: var(--red); color: #fff; border: none;
  padding: 16px 28px; font-size: 0.88rem; font-weight: 600;
  letter-spacing: 0.06em; cursor: pointer; font-family: var(--ff-en);
  transition: background 0.2s; align-self: flex-start;
}
[data-lang="ar"] .form-submit-btn { font-family: var(--ff-ar); }
.form-submit-btn:hover { background: var(--red-hi); }
.form-success {
  display: none; padding: 20px 24px;
  border: 1px solid var(--border2); border-left: 3px solid var(--red);
  font-size: 0.9rem; line-height: 1.6;
}
[data-lang="ar"] .form-success { border-left: none; border-right: 3px solid var(--red); }
.form-success.visible { display: block; }

/* ─── DISCLAIMER ──────────────────────────────────────────── */
#disclaimer { background: var(--surf); border-top: 1px solid var(--border); padding: 56px 0; }
.disc-inner { max-width: 800px; }
.disc-title {
  font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--red); font-family: var(--ff-en); font-weight: 600; margin-bottom: 16px;
}
[data-lang="ar"] .disc-title { font-family: var(--ff-ar); }
.disc-text { font-size: 0.8rem; color: var(--dim); line-height: 1.75; }

/* ─── FOOTER ──────────────────────────────────────────────── */
footer {
  padding: 32px 0; border-top: 1px solid var(--border);
  background: var(--bg);
}
.footer-inner {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px;
}
.footer-brand { display: flex; align-items: center; gap: 10px; }
.footer-brand-text { font-family: var(--ff-en); font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; }
.footer-nav { display: flex; gap: 20px; flex-wrap: wrap; }
.footer-nav a { font-size: 0.75rem; color: var(--dim); text-decoration: none; transition: color 0.2s; }
.footer-nav a:hover { color: var(--muted); }
.footer-right { font-size: 0.72rem; color: var(--dim); display: flex; align-items: center; gap: 12px; }
.footer-lang { background: none; border: 1px solid var(--border); color: var(--dim); font-size: 0.68rem; letter-spacing: 0.1em; padding: 4px 8px; cursor: pointer; font-family: var(--ff-en); }
.footer-lang:hover { color: var(--text); }

/* ─── MOBILE CTA ──────────────────────────────────────────── */
#mobileCta {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 99;
  background: var(--red); color: #fff;
  padding: 14px 24px; text-align: center;
  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.06em;
  font-family: var(--ff-en); cursor: pointer; border: none;
  transition: background 0.2s;
}
[data-lang="ar"] #mobileCta { font-family: var(--ff-ar); }
#mobileCta:hover { background: var(--red-hi); }

/* ─── ANIMATIONS ──────────────────────────────────────────── */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.in { opacity: 1; transform: none; }
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.3s; }

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; }
  * { transition: none !important; animation: none !important; }
}

/* ─── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 900px) {
  section { padding: 64px 0; }
  .hero-grid { flex-direction: column; }
  .hero-chart { height: auto; }
  .about-grid { grid-template-columns: 1fr; }
  .about-photo { aspect-ratio: 16/9; }
  .problem-grid { grid-template-columns: 1fr; }
  .snr-cards { grid-template-columns: 1fr; }
  .snr-beyond-grid { grid-template-columns: 1fr 1fr; }
  .approach-vs { grid-template-columns: 1fr; }
  .vs-divider { writing-mode: horizontal-tb; padding: 16px; }
  .course-header { grid-template-columns: 1fr; }
  .pricing-grid { grid-template-columns: 1fr; }
  .test-grid { grid-template-columns: 1fr; }
  .form-layout { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  nav { display: none; }
  .hamburger { display: flex; }
  #mobileCta { display: block; }
  body { padding-bottom: 56px; }
  .footer-inner { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 540px) {
  .snr-beyond-grid { grid-template-columns: 1fr; }

  .btn { width: 100%; justify-content: center; }
  .price-box { padding: 28px; }
  .approach-vs { gap: 1px; }
}

let lang = 'ar';

function t(key) { return T[lang][key] || key; }

function applyLang() {
  document.documentElement.lang = lang;
  document.body.setAttribute('data-lang', lang);
  document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';
  // static i18n
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = T[lang][key];
    if (val !== undefined && typeof val === 'string') {
      // highlight "MSNR" in red in hero h1 line-1
      if (key === 'hero_h1_1') {
        el.innerHTML = val.replace(/MSNR/g, '<span style="color:var(--red)">MSNR</span>');
      } else {
        el.textContent = val;
      }
    }
  });
  // lang toggle buttons
  const toggle = lang === 'ar' ? 'EN' : 'عربي';
  document.getElementById('langToggle').textContent = toggle;
  const fl = document.getElementById('footerLang');
  if (fl) fl.textContent = toggle;
  // rebuild dynamic sections
  buildProblemList();
  buildMSNRCards();
  buildMSNRBeyond();
  buildMethSteps();
  buildApproach();
  buildCourseSpec();
  buildPhases();
  buildWhoYes();
  buildTestimonials();
}

function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar';
  applyLang();
}

// ── Circular Carousel ────────────────────────────────────────
(function() {
  const VISIBLE = 5, RX = 220, RY = 100;
  let cur = 0, autoT = null, items = [];

  const ITEMS_AR = [
    { tag:'MSNR',     title:'فهمت المناطق أخيراً',      desc:'الدورة غيّرت طريقة تفكيري في تحليل السوق.' },
    { tag:'منهجية', title:'منهجية واضحة وعملية',      desc:'للمرة الأولى أملك خطة واضحة لتحليل السوق.' },
    { tag:'مبتدئ',  title:'مناسبة للمبتدئين تماماً',   desc:'بدأت من الصفر وأصبحت أفهم S&R احترافياً.' },
    { tag:'تطبيق',  title:'قابلة للتطبيق فوراً',       desc:'بعد الدورة مباشرة بدأت التطبيق بثقة.' },
    { tag:'تحليل',  title:'تحليل أعمق للسوق',          desc:'تعلمت كيف أقرأ السوق بطريقة منظمة.' },
    { tag:'قيمة',   title:'تستحق كل ريال',             desc:'المحتوى عالي الجودة والشرح مبسط.' },
  ];
  const ITEMS_EN = [
    { tag:'MSNR',      title:'Finally Understand Zones',  desc:'This course changed how I think about market analysis.' },
    { tag:'Method',   title:'Clear & Practical Method',  desc:'For the first time I have a structured market plan.' },
    { tag:'Beginner', title:'Perfect for Beginners',     desc:'Started from zero and understand S&R professionally.' },
    { tag:'Apply',    title:'Instantly Applicable',      desc:'Right after the course I applied concepts with confidence.' },
    { tag:'Analysis', title:'Deeper Market Reading',     desc:'Learned to read the market in an organized way.' },
    { tag:'Value',    title:'Worth Every Penny',         desc:'High quality content with clear explanations.' },
  ];

  function pos(idx, active, total) {
    let off = idx - active;
    const half = Math.floor(VISIBLE / 2);
    if (off >  half) off -= total;
    if (off < -half) off += total;
    if (Math.abs(off) > half * 2) return null;
    const angle = (off / VISIBLE) * Math.PI;
    const x = Math.sin(angle) * RX;
    const y = -Math.cos(angle) * RY;
    const d = Math.abs(off), md = half + 1;
    return {
      x, y,
      scale:   Math.max(0.01, 1 - (d / md) * 0.3),
      opacity: Math.max(0.28, 1 - (d / md) * 0.72),
      z:       VISIBLE - d,
      isActive: idx === active,
    };
  }

  function render() {
    const track = document.getElementById('ccTrack');
    const dots  = document.getElementById('ccDots');
    const num   = document.getElementById('ccNum');
    const of_   = document.getElementById('ccOf');
    if (!track) return;
    const total = items.length;

    num.textContent = String(cur + 1).padStart(2,'0');
    of_.textContent = (lang==='ar' ? 'من ' : 'of ') + String(total).padStart(2,'0');

    Array.from(track.querySelectorAll('.cc-card')).forEach((card, i) => {
      const p = pos(i, cur, total);
      if (!p) { card.style.opacity='0'; card.style.pointerEvents='none'; return; }
      card.style.opacity   = p.opacity;
      card.style.zIndex    = p.z;
      card.style.transform = `translateX(${p.x}px) translateY(${p.y}px) scale(${p.scale})`;
      card.style.pointerEvents = 'auto';
      card.classList.toggle('is-active', p.isActive);
    });

    Array.from(dots.querySelectorAll('.cc-dot')).forEach((d, i) => {
      d.classList.toggle('is-active', i === cur);
    });
  }

  function goTo(idx) {
    const total = items.length;
    cur = ((idx % total) + total) % total;
    render();
  }

  function build() {
    items = lang === 'ar' ? ITEMS_AR : ITEMS_EN;
    const track = document.getElementById('ccTrack');
    const dots  = document.getElementById('ccDots');
    if (!track || !dots) return;

    track.innerHTML = '';
    dots.innerHTML  = '';

    items.forEach((it, i) => {
      const btn = document.createElement('button');
      btn.className = 'cc-card';
      btn.setAttribute('role','option');
      btn.setAttribute('aria-label', it.title);
      btn.innerHTML = `
        <span class="cc-card-tag">${it.tag}</span>
        <div class="cc-card-body">
          <div class="cc-card-title">${it.title}</div>
          <div class="cc-card-desc">${it.desc}</div>
        </div>`;
      btn.addEventListener('click', () => goTo(i));
      track.appendChild(btn);

      const dot = document.createElement('button');
      dot.className = 'cc-dot';
      dot.setAttribute('role','tab');
      dot.setAttribute('aria-label', `Item ${i+1}`);
      dot.addEventListener('click', () => { clearInterval(autoT); goTo(i); });
      dots.appendChild(dot);
    });

    cur = 0;
    render();
    clearInterval(autoT);
    autoT = setInterval(() => goTo(cur + 1), 4000);
  }

  window.buildTestimonials = build;

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('ccPrev')?.addEventListener('click', () => { clearInterval(autoT); goTo(cur - 1); });
    document.getElementById('ccNext')?.addEventListener('click', () => { clearInterval(autoT); goTo(cur + 1); });
    const stage = document.getElementById('ccStage');
    if (stage) {
      stage.addEventListener('mouseenter', () => clearInterval(autoT));
      stage.addEventListener('mouseleave', () => { autoT = setInterval(() => goTo(cur + 1), 4000); });
      stage.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft')  { clearInterval(autoT); goTo(cur - 1); }
        if (e.key === 'ArrowRight') { clearInterval(autoT); goTo(cur + 1); }
      });
    }
    build();
  });
})();



// ── Hero Chart — static image, no canvas needed ──────────────────────
(function heroChart() {
  const canvas = document.getElementById('heroCanvas');
  if (!canvas) return; // canvas removed, img used instead
  const ctx = canvas.getContext('2d');

  // [open, high, low, close]  — 28 candles: peak → decline → MSNR zone
  const RAW = [
    [4683,4690,4679,4687],[4687,4694,4683,4692],[4692,4695,4686,4689],
    [4689,4693,4683,4685],[4685,4688,4676,4679],[4679,4683,4671,4674],
    [4674,4678,4665,4669],[4669,4673,4660,4663],[4663,4667,4656,4658],
    [4658,4662,4650,4653],[4653,4657,4646,4648],[4648,4652,4643,4645],
    // entering MSNR zone — more volatile, red wicks
    [4645,4650,4638,4641],[4641,4646,4634,4637],[4637,4641,4629,4632],
    [4632,4637,4624,4626],[4626,4631,4618,4621],[4621,4625,4612,4615],
    [4615,4620,4606,4609],[4609,4615,4603,4613],
    // bounce/consolidation inside zone
    [4613,4618,4607,4616],[4616,4620,4609,4611],[4611,4617,4606,4614],
    [4614,4619,4607,4612],[4612,4617,4606,4609],[4609,4615,4604,4611],
    [4611,4616,4605,4614],[4614,4618,4607,4612]
  ];

  // Price levels (from screenshot axis)
  const P_MAX = 4700, P_MIN = 4598;
  // MSNR zone bounds
  const Z_OUTER_TOP = 4654, Z_BOT = 4604;
  const Z_INNER_TOP = 4644;
  // Reference lines
  const LN1 = 4651.9, LN2 = 4643.0;

  function draw() {
    const W = canvas.width, H = canvas.height;
    const PL = 8, PR = W * 0.155, PT = 10, PB = 10;
    const CW = W - PL - PR, CH = H - PT - PB;
    const NC = RAW.length;
    const SLOT = CW / NC;
    const BODY = Math.max(SLOT * 0.52, 2);

    function py(p) { return PT + (P_MAX - p) / (P_MAX - P_MIN) * CH; }
    function cx(i) { return PL + (i + 0.5) * SLOT; }

    // ── background & border ──
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

    // ── grid lines (horizontal only, subtle) ──
    const gridPrices = [4692,4684,4676,4668,4660,4652,4644,4636,4628,4620,4612,4604];
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([]);
    gridPrices.forEach(p => {
      const y = py(p);
      ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(W - PR, y); ctx.stroke();
    });

    // ── MSNR zones (behind candles) ──
    const zStartX = cx(9) - SLOT * 0.5; // zone starts around candle 9
    const zEndX   = W - PR;

    // outer zone — lighter teal
    ctx.fillStyle = 'rgba(0,176,176,0.18)';
    ctx.fillRect(zStartX, py(Z_OUTER_TOP), zEndX - zStartX, py(Z_BOT) - py(Z_OUTER_TOP));

    // inner zone — darker teal
    ctx.fillStyle = 'rgba(0,148,160,0.32)';
    ctx.fillRect(zStartX, py(Z_INNER_TOP), zEndX - zStartX, py(Z_BOT) - py(Z_INNER_TOP));

    // zone left border line (vertical)
    ctx.strokeStyle = 'rgba(0,160,160,0.6)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 2]);
    ctx.beginPath();
    ctx.moveTo(zStartX, py(Z_OUTER_TOP));
    ctx.lineTo(zStartX, py(Z_BOT));
    ctx.stroke();
    ctx.setLineDash([]);

    // ── horizontal reference lines ──
    function refLine(p, fromCandle) {
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(cx(fromCandle) - SLOT * 0.5, py(p));
      ctx.lineTo(W - PR + 2, py(p));
      ctx.stroke();
    }
    refLine(LN1, 9);
    refLine(LN2, 11);

    // ── candles ──
    const GREEN = '#26a69a', GREEN_DARK = '#1a7a71';
    const RED   = '#ef5350', RED_DARK   = '#c62828';

    RAW.forEach(([o, h, l, c], i) => {
      const x = cx(i);
      const isUp = c >= o;
      const col  = isUp ? GREEN : RED;
      const dark = isUp ? GREEN_DARK : RED_DARK;

      // wick
      ctx.strokeStyle = dark;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, py(h)); ctx.lineTo(x, py(l));
      ctx.stroke();

      // body
      const bY = Math.min(py(o), py(c));
      const bH = Math.max(Math.abs(py(c) - py(o)), 1.5);

      if (isUp) {
        // bullish: filled green
        ctx.fillStyle = col;
        ctx.fillRect(x - BODY / 2, bY, BODY, bH);
      } else {
        // bearish: filled red
        ctx.fillStyle = col;
        ctx.fillRect(x - BODY / 2, bY, BODY, bH);
      }
    });

    // ── annotation labels ──
    function badge(lines, bx, by, bg) {
      const fs  = Math.max(7, Math.min(10, W * 0.019));
      ctx.font  = `bold ${fs}px "Space Mono", Courier, monospace`;
      const lw  = Math.max(...lines.map(t => ctx.measureText(t).width));
      const LH  = fs + 3;
      const bw  = lw + 10;
      const bh  = lines.length * LH + 8;

      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(bx + 1, by + 1, bw, bh);

      ctx.fillStyle = bg;
      ctx.fillRect(bx, by, bw, bh);

      ctx.fillStyle = '#fff';
      lines.forEach((t, j) => {
        ctx.fillText(t, bx + 5, by + 5 + fs + j * LH);
      });
    }

    // Label positions tuned to candle indices
    const fs0 = Math.max(7, Math.min(10, W * 0.019));
    badge(['8','30M','REJ'],  cx(8)  - SLOT * 2.2,  py(4662) - fs0 * 4.5,  '#e91e8c');
    badge(['9','30M','RET'],  cx(9)  + SLOT * 0.4,  py(4653) - fs0 * 3.5,  '#009688');
    badge(['4','1H','QM','REF'], cx(18) + SLOT * 0.2, py(4675) - fs0 * 5.5, '#1565c0');
    badge(['7','KL AFTER','REJ'], cx(19), py(4636) - fs0 * 4.5, '#0097a7');

    // ── right price axis ──
    const axPrices = [4692,4684,4676,4668,4660,4652,4643,4631,4619,4607];
    const afs = Math.max(7, Math.min(9.5, W * 0.016));
    ctx.font = `${afs}px "Space Mono", Courier, monospace`;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#666';

    axPrices.forEach(p => {
      ctx.fillText(p.toFixed(3), W - PR + 5, py(p) + afs * 0.38);
    });

    // highlighted badges for key levels
    function axisBadge(p, bg) {
      const txt = p.toFixed(3);
      ctx.font = `bold ${afs}px "Space Mono", Courier, monospace`;
      const tw  = ctx.measureText(txt).width;
      const bh  = afs + 5;
      ctx.fillStyle = bg;
      ctx.fillRect(W - PR + 3, py(p) - bh / 2, tw + 8, bh);
      ctx.fillStyle = '#fff';
      ctx.fillText(txt, W - PR + 7, py(p) + afs * 0.38);
    }

    axisBadge(4651.9, '#37474f');
    axisBadge(4643.0, '#37474f');
    axisBadge(4605.3, '#006064');

    // label on right edge of zones
    ctx.font = `bold ${afs}px "Space Mono", Courier, monospace`;
    ctx.fillStyle = 'rgba(0,100,100,0.7)';
    ctx.textAlign = 'right';
    ctx.fillText('MSNR', W - PR - 2, py(Z_OUTER_TOP) + afs + 2);
    ctx.textAlign = 'left';
  }

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width  = rect.width  || 520;
    canvas.height = rect.height || 400;
    draw();
  }

  resize();
  window.addEventListener('resize', resize);
})();

// ── Form validation ──────────────────────────────────────
document.getElementById('regForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const d = T[lang];
  let valid = true;

  function check(id, errId, fn, msg) {
    const el = document.getElementById(id);
    const err = document.getElementById(errId);
    const ok = fn(el.value.trim());
    el.classList.toggle('error', !ok);
    err.textContent = ok ? '' : msg;
    if (!ok) valid = false;
  }

  check('f_name','err_name', v=>v.length>1, d.form_error_required);
  check('f_email','err_email', v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), d.form_error_email);
  check('f_age','err_age', v=>{const n=parseInt(v);return n>=18&&n<=80;}, d.form_error_age);
  check('f_country','err_country', v=>v.length>1, d.form_error_required);
  check('f_exp','err_exp', v=>v.length>5, d.form_error_required);
  check('f_telegram','err_telegram', v=>v.length>2, d.form_error_required);
  check('f_challenge','err_challenge', v=>v.length>5, d.form_error_required);

  if (valid) {
    this.style.display='none';
    const s = document.getElementById('formSuccess');
    s.classList.add('visible');
    s.textContent = d.form_success;
  }
});

// Remove error on input
['f_name','f_email','f_age','f_country','f_telegram','f_exp','f_challenge'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener('input',()=>{el.classList.remove('error');document.getElementById('err_'+id.replace('f_','')).textContent='';});
});

// ── Reveal on scroll ─────────────────────────────────────
(function initReveal() {
  const els = document.querySelectorAll('.reveal');
  if (!els.length) return;
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    els.forEach(el => io.observe(el));
  } else {
    els.forEach(el => el.classList.add('in'));
  }
})();

// ── Init ─────────────────────────────────────────────────
applyLang();
</script>
